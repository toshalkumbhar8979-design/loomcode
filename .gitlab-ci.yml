# Cross-platform CI: unit tests + strict core typecheck on Linux and Windows.
# macOS: add a job with `tags: [macos]` once a macOS runner is available.
#
# The full `bun run test` gate runs: interactive TUI test (50), unit tests (87),
# and `lint:core` (strict TypeScript over the core JSDoc layer).
#
# Bun is pinned to 1.3.14 on both platforms so CI never silently tracks a new
# release. Linux installs via npm (registry integrity hash is verified);
# Windows downloads the exact release zip and verifies its SHA-256 before use.

stages:
  - test

.test-core: &test-core
  stage: test
  script:
    - bun install --frozen-lockfile
    - bun run test

test:linux:
  <<: *test-core
  image: node:22
  before_script:
    - npm install -g bun@1.3.14 --silent

test:windows:
  <<: *test-core
  tags:
    - windows
  before_script:
    - $zip = "$env:TEMP\bun-1.3.14.zip"
    - iwr "https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-windows-x64.zip" -UseBasicParsing -OutFile $zip
    - $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
    - if ($sha -ne "0a0620930b6675d7ba440e81f4e0e00d3cfbe096c4b140d3fff02205e9e18922") { throw "Bun 1.3.14 zip checksum mismatch: $sha" }
    - Expand-Archive $zip -DestinationPath "$env:USERPROFILE\.bun" -Force
    - $env:PATH = "$env:USERPROFILE\.bun\bun-windows-x64;$env:PATH"
